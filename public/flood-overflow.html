<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Flood overflow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
/* Flood overflow - minimal shell. Palette matches flood-sim/css/flood-sim.css. */

:root {
  --paper-glass: rgba(244, 247, 248, 0.97);
  --ink: #0f2533;
  --ink-2: #475a66;
  --ink-3: #6f7f88;
  --rule: #d3dde2;
  --accent: #1c5cab;
  --accent-hover: #184f95;
  --danger-ink: #a32525;
  --shadow: 0 1px 2px rgba(15, 37, 51, 0.14), 0 10px 28px rgba(15, 37, 51, 0.24);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-tight: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0c1a22;
  color: var(--ink);
  font: 400 13px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}

#map {
  position: fixed;
  inset: 0;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

/* ------------------------------------------------------------- info card */

.info-card {
  position: fixed;
  top: 14px;
  left: 14px;
  width: 300px;
  padding: 16px 18px;
  border-radius: 12px;
  background: var(--paper-glass);
  box-shadow: var(--shadow);
  z-index: 5;

}

.info-card h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.info-card p {
  margin: 6px 0 0;
  font-size: 12px;
  color: var(--ink-2);
  line-height: 1.45;
}

.clock-row {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-top: 14px;
}

.clock-row strong {
  font: 700 30px/1 var(--font-tight);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.clock-row span {
  font-size: 12px;
  color: var(--ink-2);
}

.stat-row {
  display: flex;
  gap: 18px;
  margin-top: 12px;
}

.stat {
  display: flex;
  flex-direction: column;
}

.stat span {
  font-size: 11px;
  color: var(--ink-2);
}

.stat strong {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.25;
}

.status {
  margin-top: 12px !important;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  font-size: 12px !important;
  color: var(--ink-2) !important;
}

.status[data-kind="error"] {
  color: var(--danger-ink) !important;
}

/* ----------------------------------------------------------------- legend */

.legend-card {
  position: fixed;
  top: 14px;
  right: 14px;
  width: 220px;
  padding: 12px 14px 14px;
  border-radius: 12px;
  background: var(--paper-glass);
  box-shadow: var(--shadow);
  z-index: 5;
}

.legend-title {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-2);
}

.legend-bar {
  height: 10px;
  margin-top: 6px;
  border-radius: 3px;
}

.legend-ticks {
  position: relative;
  height: 16px;
  margin-top: 3px;
  font: 500 11px var(--font-tight);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.legend-ticks span {
  position: absolute;
  transform: translateX(-50%);
  white-space: nowrap;
}

.legend-ticks span:first-child {
  transform: none;
}

.legend-ticks span:last-child {
  transform: translateX(-100%);
}

/* -------------------------------------------------------------- play button */

.play-btn {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%);
  z-index: 5;
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: background-color 0.12s, transform 0.08s;
}

.play-btn:hover:not(:disabled) {
  background: #22414f;
}

.play-btn:active:not(:disabled) {
  transform: translateX(-50%) scale(0.96);
}

.play-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.play-btn svg {
  width: 32px;
  height: 32px;
}

.play-btn .i-pause {
  display: none;
}

.play-btn.playing .i-play {
  display: none;
}

.play-btn.playing .i-pause {
  display: block;
}

.play-hint {
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  z-index: 5;
  margin: 0;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(15, 37, 51, 0.55);
  color: #fff;
  font-size: 11px;
  pointer-events: none;
}

.play-hint kbd {
  font: inherit;
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.22);
}

/* ------------------------------------------------------------------ toast */

.toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  max-width: min(520px, calc(100vw - 32px));
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-weight: 500;
  box-shadow: var(--shadow);
}

.toast[data-kind="error"] {
  background: var(--danger-ink);
  border-radius: 10px;
}

/* ------------------------------------------------------------- edit panel */

.edit-panel {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 6;
  width: 280px;
  padding: 12px 14px 14px;
  border-radius: 12px;
  background: var(--paper-glass);
  box-shadow: var(--shadow);
}

.edit-panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
}

.edit-panel-title kbd {
  font: 700 10px var(--font-tight);
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--ink);
  color: #fff;
}

.edit-panel-tabs {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.edit-tab {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: #fff;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.edit-tab.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.edit-panel-check {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
}

.edit-panel-check input {
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}

.edit-panel-hint {
  margin: 10px 0 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--ink-2);
}

.edit-detect-btn,
.edit-copy-btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.edit-detect-btn {
  background: var(--accent);
}

.edit-detect-btn:hover {
  background: var(--accent-hover);
}

.edit-detect-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.edit-copy-btn {
  background: var(--ink);
}

.edit-copy-btn:hover {
  background: #22414f;
}

/* -------------------------------------------------------------- responsive */

@media (max-width: 640px) {
  .info-card {
    width: min(300px, calc(100vw - 28px));
  }

  .legend-card {
    display: none;
  }

  .play-btn {
    width: 66px;
    height: 66px;
    bottom: 26px;
  }

  .play-btn svg {
    width: 26px;
    height: 26px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>

<body>
    <div id="map" aria-label="Map"></div>

    <div class="info-card" id="info-card" style="display: none;">
        <h1>Flood overflow</h1>
        <p id="info-line">Setting up automatically&hellip;</p>
        <div class="clock-row">
            <strong id="clock-now">0:00</strong>
            <span id="clock-total">of 0:00 h</span>
        </div>
        <div class="stat-row">
            <div class="stat"><span>Flooded land</span><strong id="stat-area">0 ha</strong></div>
            <div class="stat"><span>Peak vs. bankfull</span><strong id="stat-ratio">&ndash;</strong></div>
        </div>
        <p class="status" id="status-line">Loading terrain&hellip;</p>
    </div>

    <div class="legend-card" id="legend-card" hidden>
        <div class="legend-title">Water depth <span>m</span></div>
        <div class="legend-bar" id="legend-bar"></div>
        <div class="legend-ticks" id="legend-ticks"></div>
    </div>

    <button type="button" class="play-btn" id="btn-play" aria-label="Play" disabled style="display: none;">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 5.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4l-11-6.8a.8.8 0 0 0-1.2.7z"
                fill="currentColor" />
        </svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="5" width="4.2" height="14" rx="1" fill="currentColor" />
            <rect x="13.8" y="5" width="4.2" height="14" rx="1" fill="currentColor" />
        </svg>
    </button>
    <p class="play-hint" id="play-hint" style="display: none;">Press <kbd>Space</kbd> or click to play</p>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="edit-panel" id="edit-panel" hidden>
        <div class="edit-panel-title">Edit river path <kbd>E</kbd></div>
        <div class="edit-panel-tabs">
            <button type="button" class="edit-tab" id="edit-tab-0" data-reach="0">Main river</button>
            <button type="button" class="edit-tab" id="edit-tab-1" data-reach="1">Tributary</button>
        </div>
        <label class="edit-panel-check">
            <input type="checkbox" id="edit-hide-water">
            Hide river water
        </label>
        <p class="edit-panel-hint">Drag a point to move it. Click a small dot on the line to add a point.
            Right-click a point to delete it.</p>
        <button type="button" class="edit-detect-btn" id="edit-detect-btn">Auto-detect from map (OSM waterway data)</button>
        <button type="button" class="edit-copy-btn" id="edit-copy-btn">Copy coordinates JSON</button>
    </div>

/* ---- flood-sim/js/geo.js ---- */
/*
 * geo.js - Web Mercator conversions and planar geometry helpers.
 *
 * The simulation grid is aligned with Web Mercator so that the flood raster
 * drapes exactly onto the map. Over a few kilometres the Mercator scale is
 * effectively constant, so one metres-per-unit factor (at the grid's centre
 * latitude) converts grid distances to ground distances.
 */
(function (FS) {
  'use strict';

  const EARTH_CIRCUMFERENCE = 40075016.68557849; // metres (WGS84 equator)
  const DEG = Math.PI / 180;
  const MAX_LAT = 85.051129;

  const mercX = (lng) => (lng + 180) / 360;
  const lngOf = (x) => x * 360 - 180;
  const latOf = (y) => Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) / DEG;

  function mercY(lat) {
    const s = Math.sin(Math.max(-MAX_LAT, Math.min(MAX_LAT, lat)) * DEG);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  }

  const toMerc = (p) => [mercX(p[0]), mercY(p[1])];
  const toLngLat = (m) => [lngOf(m[0]), latOf(m[1])];

  /** Ground metres per Mercator unit at a latitude. */
  const metersPerUnit = (lat) => EARTH_CIRCUMFERENCE * Math.cos(lat * DEG);

  function haversine(a, b) {
    const R = 6371008.8;
    const dLat = (b[1] - a[1]) * DEG;
    const dLng = (b[0] - a[0]) * DEG;
    const s = Math.sin(dLat / 2) ** 2 +
      Math.cos(a[1] * DEG) * Math.cos(b[1] * DEG) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  function lineLength(coords) {
    let total = 0;
    for (let i = 1; i < coords.length; i++) total += haversine(coords[i - 1], coords[i]);
    return total;
  }

  /** Squared distance from point p to segment ab, plus the projection parameter. */
  function segmentDistance2(px, py, ax, ay, bx, by, out) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    const tc = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = ax + tc * dx - px, ey = ay + tc * dy - py;
    if (out) out.t = t;
    return ex * ex + ey * ey;
  }

  /** Resample a planar polyline every `spacing` units. Returns { pts, s, length }. */
  function resample(pts, spacing) {
    const out = [[pts[0][0], pts[0][1]]];
    const s = [0];
    let dist = 0;
    let next = spacing;
    for (let i = 1; i < pts.length; i++) {
      const ax = pts[i - 1][0], ay = pts[i - 1][1];
      const bx = pts[i][0], by = pts[i][1];
      const seg = Math.hypot(bx - ax, by - ay);
      if (seg === 0) continue;

      if (!cur || seg[2]) {

      roads,
      facilities: [...facilities.values()],

      });
      m.addLayer({
        id: 'fs-imp-facilities', type: 'circle', source: 'fs-imp-facilities', slot: 'top',
        paint: {

          'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff', 'circle-emissive-strength': 1
        }
      });
      m.addLayer({

        layout: { 'text-field': ['get', 'name'], 'text-size': 11, 'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-max-width': 12 },
        paint: { 'text-color': '#ffffff', 'text-halo-color': '#0f2533', 'text-halo-width': 1.5, 'text-emissive-strength': 1 }
      });

      m.addSource('fs-gauge', { type: 'geojson', data: EMPTY });
      m.addSource('fs-gauge-section', { type: 'geojson', data: EMPTY });
      m.addLayer({
        id: 'fs-gauge-section', type: 'line', source: 'fs-gauge-section', slot: 'top',
        paint: { 'line-color': '#ffffff', 'line-width': 1.5, 'line-opacity': 0.7, 'line-emissive-strength': 1 }
      });
      m.addLayer({
        id: 'fs-gauge', type: 'circle', source: 'fs-gauge', slot: 'top',
        paint: {
          'circle-radius': 7, 'circle-color': '#fab219', 'circle-stroke-width': 2.5,
          'circle-stroke-color': '#0f2533', 'circle-emissive-strength': 1, 'circle-pitch-alignment': 'map'
        }
      });
      m.addLayer({
        id: 'fs-gauge-label', type: 'symbol', source: 'fs-gauge', slot: 'top',
        layout: { 'text-field': 'Gauge', 'text-size': 12, 'text-offset': [0, -1.5], 'text-anchor': 'bottom', 'text-allow-overlap': true },
        paint: { 'text-color': '#ffffff', 'text-halo-color': '#0f2533', 'text-halo-width': 1.6, 'text-emissive-strength': 1 }
      });

      for (const key of Object.keys(MODEL_LAYERS)) this.setVisible(key, this.visible[key]);
    }

    clearModel() {
      const m = this.map;
      for (const ids of Object.values(MODEL_LAYERS)) for (const id of ids) if (m.getLayer(id)) m.removeLayer(id);
      for (const id of ['fs-flood', 'fs-particles', 'fs-channel', 'fs-outline', 'fs-arrows', 'fs-imp-buildings', 'fs-imp-roads', 'fs-imp-facilities', 'fs-gauge', 'fs-gauge-section']) {
        if (m.getSource(id)) m.removeSource(id);
      }

      this.model = null;
      this.particles = null;
    }

    setGauge(gauge) {
      if (!this.model) return;
      this.map.getSource('fs-gauge').setData({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: gauge.lngLat } });
      this.map.getSource('fs-gauge-section').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: gauge.section } });
    }

    setVisible(key, on) {
      this.visible[key] = on;
      for (const id of MODEL_LAYERS[key] || []) {
        if (this.map.getLayer(id)) this.map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
      }
      if (key === 'particles' && !on && this.particles) {
        this.particles.clear();

      }
    }

    setRiverVisible(on) {
      for (const id of ['fs-river-casing', 'fs-river-line', 'fs-river-arrows', 'fs-river-vertices', 'fs-river-labels', 'fs-river-mids']) {
        if (this.map.getLayer(id)) this.map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');

    setOpacity(value) {

    }

    /** Ask Mapbox to re-read a canvas source, keeping it live briefly so the terrain drape updates. */
    refresh(id) {
      const src = this.map.getSource(id);
      if (!src || !src.play) return;
      if (!this.playing.has(id)) src.play();
      this.playing.set(id, performance.now());
    }

    tick(now) {
      for (const [id, since] of this.playing) {
        if (now - since > 300) {
          const src = this.map.getSource(id);
          if (src && src.pause) src.pause();
          this.playing.delete(id);
        }
      }
    }

    /**
     * Colour the flood raster.
     * ctx: { mode, state, cells, K, peak, arrival, tNow, floodDepth, arrivalRamp }
     */
    renderFlood(ctx) {
      if (!this.model) return;
      const img = this.floodImage.data;
      img.fill(0);
      const { mode, state, cells, K, floodDepth } = ctx;
      const channel = this.model.notLand || this.model.channelMask;
      const C = FS.colors;
      const h = state.h, u = state.u, v = state.v;

      if (mode === 'depth' || mode === 'peak') {
        const field = mode === 'peak' ? ctx.peak : h;
        const lut = C.depth.lut;
        for (let m = 0; m < K; m++) {
          const c = cells[m];
          const d = field[c];
          if (d < 0.02) continue;
          const li = C.depth.index(d) * 3, o = c * 4;
          img[o] = lut[li]; img[o + 1] = lut[li + 1]; img[o + 2] = lut[li + 2];
          img[o + 3] = 150 + Math.min(100, d * 35);
        }
      } else if (mode === 'velocity') {
        const lut = C.velocity.lut;
        for (let m = 0; m < K; m++) {
          const c = cells[m];
          if (h[c] < 0.05) continue;
          const sp = Math.sqrt(u[c] * u[c] + v[c] * v[c]);
          const li = C.velocity.index(sp) * 3, o = c * 4;
          img[o] = lut[li]; img[o + 1] = lut[li + 1]; img[o + 2] = lut[li + 2]; img[o + 3] = 230;
        }
      } else if (mode === 'hazard') {
        const classes = C.hazard.classes;
        for (let m = 0; m < K; m++) {
          const c = cells[m];
          const d = h[c];
          if (channel[c] || d < floodDepth) continue;
          const cls = classes[C.hazard.classify(d, Math.sqrt(u[c] * u[c] + v[c] * v[c]))];
          const o = c * 4;
          img[o] = cls.rgb[0]; img[o + 1] = cls.rgb[1]; img[o + 2] = cls.rgb[2]; img[o + 3] = 235;
        }
      } else if (mode === 'arrival') {
        const ramp = ctx.arrivalRamp, lut = ramp.lut, arrival = ctx.arrival, tNow = ctx.tNow;
        const start = C.startWater;
        for (let m = 0; m < K; m++) {
          const c = cells[m];
          const a = arrival[c];
          if (!(a <= tNow)) continue;
          const o = c * 4;
          if (a <= 0) {
            img[o] = start[0]; img[o + 1] = start[1]; img[o + 2] = start[2]; img[o + 3] = 150;
          } else {
            const li = ramp.index(a / 3600) * 3;
            img[o] = lut[li]; img[o + 1] = lut[li + 1]; img[o + 2] = lut[li + 2]; img[o + 3] = 235;
          }
        }
      }
      this.floodCtx.putImageData(this.floodImage, 0, 0);
      this.refresh('fs-flood');
    }

    clearFlood() {
      if (!this.model) return;
      this.floodImage.data.fill(0);
      this.floodCtx.putImageData(this.floodImage, 0, 0);
      this.refresh('fs-flood');
      if (this.particles) { this.particles.clear(); this.refresh('fs-particles'); }
      for (const id of ['fs-outline', 'fs-arrows', 'fs-imp-buildings', 'fs-imp-roads', 'fs-imp-facilities']) {
        const src = this.map.getSource(id);
        if (src) src.setData(EMPTY);
      }
    }

    updateParticles(state, cells, K) {
      if (this.particles) this.particles.setField(state, cells, K);
    }

    animateParticles(dtSec) {
      if (!this.particles || !this.visible.particles) return;
      this.particles.step(dtSec);
      this.refresh('fs-particles');
    }

    updateOutline(depth, threshold, box) {
      if (!this.model || !this.visible.outline) return;
      const { nx, ny } = this.model.grid;
      const seg = G.contour(depth, nx, ny, threshold, box);
      const lines = [];
      for (let k = 0; k < seg.length; k += 4) {
        lines.push([this.gridLngLat(seg[k], seg[k + 1]), this.gridLngLat(seg[k + 2], seg[k + 3])]);
      }
      this.map.getSource('fs-outline').setData({ type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates: lines } });
    }

    updateArrows(state) {
      if (!this.model || !this.visible.arrows) return;
      const { nx, ny, dx } = this.model.grid;
      const stride = Math.max(2, Math.round(90 / dx));
      const features = [];
      for (let j = stride >> 1; j < ny; j += stride) {
        for (let i = stride >> 1; i < nx; i += stride) {
          const c = j * nx + i;
          if (state.h[c] < 0.1) continue;
          const u = state.u[c], v = state.v[c];
          const speed = Math.sqrt(u * u + v * v);
          if (speed < 0.1) continue;
          features.push({
            type: 'Feature',
            properties: { b: Math.round(G.bearing(u, -v)), s: Math.round(speed * 10) / 10 },
            geometry: { type: 'Point', coordinates: this.gridLngLat(i + 0.5, j + 0.5) }
          });
        }
      }
      this.map.getSource('fs-arrows').setData({ type: 'FeatureCollection', features });
    }

    updateImpacts(collections) {
      if (!this.model) return;
      this.map.getSource('fs-imp-buildings').setData(collections.buildings);
      this.map.getSource('fs-imp-roads').setData(collections.roads);
      this.map.getSource('fs-imp-facilities').setData(collections.facilities);
    }
  }

  FS.overlays = { Overlays, Particles };
})(self.FloodSim = self.FloodSim || {});


/* ---- flood-sim/js/editor.js ---- */
/*
 * editor.js - draw and edit the river centreline on the map.
 *
 * Draw:  click to add points from upstream to downstream; double-click or
 *        press Enter to finish; Backspace removes the last point; Esc cancels.
 * Edit:  drag points; click a small midpoint handle to insert a point;
 *        right-click a point to delete it.
 * Gauge: click near the river to move the gauge.
 */
(function (FS) {
  'use strict';

  class RiverEditor {
    constructor(map, overlays, onEvent) {
      this.map = map;
      this.overlays = overlays;
      this.emit = onEvent;
      this.coords = [];
      this.mode = 'view';
      this.dragIndex = -1;
      this.cursor = null;
      this.previous = null;
      this.pendingRender = false;

      map.on('click', (e) => this.onClick(e));
      map.on('dblclick', (e) => this.onDoubleClick(e));
      map.on('mousemove', (e) => this.onMove(e));
      map.on('mousedown', 'fs-river-vertices', (e) => this.onVertexDown(e));
      map.on('touchstart', 'fs-river-vertices', (e) => this.onVertexDown(e));
      map.on('mouseup', () => this.endDrag());
      map.on('touchend', () => this.endDrag());
      map.on('touchmove', (e) => this.onMove(e));
      map.on('contextmenu', (e) => this.onContextMenu(e));
      map.on('mouseenter', 'fs-river-vertices', () => { if (this.mode === 'edit') this.setCursor('grab'); });
      map.on('mouseleave', 'fs-river-vertices', () => { if (this.mode === 'edit' && this.dragIndex < 0) this.setCursor(''); });
      map.on('mouseenter', 'fs-river-mids', () => { if (this.mode === 'edit') this.setCursor('copy'); });
      map.on('mouseleave', 'fs-river-mids', () => { if (this.mode === 'edit') this.setCursor(''); });
      window.addEventListener('keydown', (e) => this.onKey(e));
    }

    setCursor(value) {
      this.map.getCanvas().style.cursor = value;
    }

    setCoords(coords, silent) {
      this.coords = coords.map((c) => [c[0], c[1]]);
      this.render();
      if (!silent) this.emit('change', this.coords);
    }

    render() {
      let coords = this.coords;
      if (this.mode === 'draw' && this.cursor && coords.length) coords = coords.concat([this.cursor]);
      const editing = this.mode === 'edit' || this.mode === 'draw';
      // With a river network, the app draws every river and substitutes the one being edited.
      if (this.renderFn) this.renderFn(coords, editing);
      else this.overlays.setRiver(coords, editing);
    }

    scheduleRender() {
      if (this.pendingRender) return;
      this.pendingRender = true;
      requestAnimationFrame(() => {
        this.pendingRender = false;
        this.render();
      });
    }

    setMode(mode) {
      if (this.mode === mode) mode = 'view';
      this.mode = mode;
      this.cursor = null;
      if (mode === 'draw' || mode === 'gauge') {
        this.map.doubleClickZoom.disable();
        this.setCursor('crosshair');
      } else {
        this.map.doubleClickZoom.enable();
        this.setCursor('');
      }
      this.render();
      this.emit('mode', mode);
    }

    startDraw() {
      if (this.mode === 'draw') { this.finishDraw(); return; }
      this.previous = this.coords;
      this.coords = [];
      this.setMode('draw');
    }

    finishDraw() {
      const cleaned = [];
      for (const c of this.coords) {
        const last = cleaned[cleaned.length - 1];
        if (!last || FS.geo.haversine(last, c) > 3) cleaned.push(c);
      }
      if (cleaned.length < 2) {
        this.coords = this.previous || [];
        this.setMode('view');
        this.emit('notice', 'A river needs at least two points. The previous river was kept.');
        return;
      }
      this.coords = cleaned;
      this.previous = null;
      this.setMode('view');
      this.emit('change', this.coords);
    }

    cancel() {
      if (this.mode === 'draw') this.coords = this.previous || this.coords;
      this.previous = null;
      this.endDrag();
      this.setMode('view');
    }

    reverse() {
      if (this.coords.length < 2) return;
      this.coords.reverse();
      this.render();
      this.emit('change', this.coords);
    }

    onClick(e) {
      if (this.mode === 'draw') {
        this.coords.push([e.lngLat.lng, e.lngLat.lat]);
        this.render();
      } else if (this.mode === 'gauge') {
        this.emit('gauge', [e.lngLat.lng, e.lngLat.lat]);
        this.setMode('view');
      } else if (this.mode === 'edit') {
        const hit = this.hit(e.point, 'fs-river-mids');
        if (hit) {
          const after = hit.properties.after;
          this.coords.splice(after + 1, 0, [e.lngLat.lng, e.lngLat.lat]);
          this.render();
          this.emit('change', this.coords);
        }
      }
    }

    onDoubleClick(e) {
      if (this.mode !== 'draw') return;
      e.preventDefault();
      this.finishDraw();
    }

    onMove(e) {
      if (this.dragIndex >= 0) {
        this.coords[this.dragIndex] = [e.lngLat.lng, e.lngLat.lat];
        this.scheduleRender();
      } else if (this.mode === 'draw') {
        this.cursor = [e.lngLat.lng, e.lngLat.lat];
        this.scheduleRender();
      }
    }

    onVertexDown(e) {
      if (this.mode !== 'edit' || !e.features || !e.features.length) return;
      const feature = e.features.find((f) => f.properties.editable);
      if (!feature) return;
      e.preventDefault();
      this.dragIndex = feature.properties.index;
      this.map.dragPan.disable();
      this.setCursor('grabbing');
    }

    endDrag() {
      if (this.dragIndex < 0) return;
      this.dragIndex = -1;
      this.map.dragPan.enable();
      this.setCursor(this.mode === 'edit' ? 'grab' : '');
      this.emit('change', this.coords);
    }

    onContextMenu(e) {
      if (this.mode !== 'edit') return;
      const hit = this.hit(e.point, 'fs-river-vertices');
      if (!hit) return;
      e.preventDefault();
      if (this.coords.length <= 2) {
        this.emit('notice', 'A river needs at least two points.');
        return;
      }
      this.coords.splice(hit.properties.index, 1);
      this.render();
      this.emit('change', this.coords);
    }

    onKey(e) {
      const target = e.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT')) return;
      if (this.mode === 'draw') {
        if (e.key === 'Enter') { e.preventDefault(); this.finishDraw(); }
        else if (e.key === 'Backspace') { e.preventDefault(); this.coords.pop(); this.render(); }
      }
      if (e.key === 'Escape' && this.mode !== 'view') this.cancel();
    }

    hit(point, layer) {
      if (!this.map.getLayer(layer)) return null;
      const box = [[point.x - 7, point.y - 7], [point.x + 7, point.y + 7]];
      const found = this.map.queryRenderedFeatures(box, { layers: [layer] })
        .filter((f) => layer !== 'fs-river-vertices' || f.properties.editable);
      return found.length ? found[0] : null;
    }
  }

  FS.editor = { RiverEditor };
})(self.FloodSim = self.FloodSim || {});


/* ---- flood-overflow/quick.js ---- */
/*
 * quick.js - "Flood overflow": every value auto-filled, no setup panel.
 *
 * Reuses the same terrain-to-hydraulics pipeline as flood-sim.html (geo,
 * terrain, channel, engine, simulation, colors, overlays) but skips the
 * editor/UI/impacts layers entirely. Two rivers (a main river and a
 * tributary that joins it) are each deliberately narrow and shallow
 * relative to the flood they are given, so both overflow their banks,
 * meet at the confluence, and spread across the valley as one flood.
 *
 * The camera is locked top-down and framed on the whole modelled area.
 * The only interaction is Play/Pause (button, or the Space key) -
 * everything else runs automatically as soon as the page loads.
 */
(function (FS) {
  'use strict';

  const CFG = FS.config;
  const $ = (id) => document.getElementById(id);
  const fmt = {
    int: (v) => Math.round(v).toLocaleString('en-US'),
    clock: (sec) => {
      const s = Math.max(0, Math.round(sec));
      return Math.floor(s / 3600) + ':' + String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    },
    area: (m2) => (m2 >= 1e4 ? (m2 / 1e4).toFixed(1) + ' ha' : Math.round(m2) + ' m²')
  };
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

  // ---- Auto-filled scenario: two channels too small for the floods they are given.
  const MAIN = { name: CFG.defaultRiver.name, coords: CFG.defaultRiver.coordinates, width: 55, depth: 3, nChannel: 0.045 };
  const TRIB = { name: CFG.defaultNetwork[0].name, coords: CFG.defaultNetwork[0].coordinates, width: 35, depth: 2.5, nChannel: 0.05 };
  // snap:false - the traced coordinates are already accurate; letting the model nudge them
  // onto the DEM's "lowest point" is what was pushing the carved channel off the real river
  // in this steep gorge, where the terrain DEM isn't fine enough to resolve the true thalweg.
  const SHARED = { nFloodplain: 0.07, padding: 700, cellSize: 0, snap: false };
  const PEAK_MULT = 14;     // peak inflow as a multiple of each channel's own bankfull capacity
  const BASE_MULT = 0.25;   // starting flow as a fraction of bankfull
  const TIME_TO_PEAK_H = 2.5;
  const DURATION_H = 7;
  const SPINUP_S = 20 * 60;
  const PLAYBACK_SPEED = 600; // simulated seconds per real second (~42 s to play the whole event)
  // "Counts as flooded from" this depth - drives the flooded-area stat, the flood-edge
  // outline and the hazard rating. Keep this small (this is a threshold, not a dial for
  // "more flood" - raising it HIDES flooding from the stats/outline instead of showing
  // more). Use PEAK_MULT above to make the flood itself bigger.
  const FLOOD_DEPTH = 0.1;

  const app = {
    map: null,
    overlays: null,
    built: null,
    run: null,
    sim: null,
    playback: null,
    state: null,
    peak: null,
    series: null,
    box: null,
    needsRender: false,
    lastNow: 0,
    timers: { readout: 0, outline: 0, impacts: 0 }
  };

  function toast(text, kind, ms) {
    const t = $('toast');
    t.textContent = text;
    t.dataset.kind = kind || 'info';
    t.hidden = false;
    clearTimeout(app.toastTimer);
    if (ms !== 0) app.toastTimer = setTimeout(() => { t.hidden = true; }, ms || 4000);
  }

  function setStatus(text, kind) {
    const el = $('status-line');
    el.textContent = text;
    el.dataset.kind = kind || '';
  }

  // ------------------------------------------------------------------ map
  function initMap() {
    mapboxgl.accessToken = CFG.MAPBOX_TOKEN;
    const map = new mapboxgl.Map({
      container: 'map',
      style: CFG.map.style,
      projection: CFG.map.projection,
      center: CFG.map.center,
      zoom: CFG.map.zoom,
      pitch: 0,
      bearing: 0,
      minPitch: 0,
      maxPitch: 0 // locked top-down: pitch can never move away from 0
    });
    app.map = map;
    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();
    app.map = map;
    map.on('style.load', () => {
      if (!map.getSource('mapbox-dem')) {

        map.addSource('mapbox-dem', { type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1', tileSize: 512, maxzoom: 14 });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: CFG.map.terrainExaggeration });
      }
      if (!app.ready) { app.ready = true; onStyleReady(); }
    });
    map.on('error', (e) => console.warn('Map error:', e && e.error ? e.error.message : e));
  }

  async function onStyleReady() {

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !$('btn-play').disabled) { e.preventDefault(); togglePlay(); }
      if ((e.key === 'e' || e.key === 'E') && !e.ctrlKey && !e.metaKey && !e.altKey) { toggleEditUI(); }
    });

    if (location.protocol === 'file:') {
      toast('Opened as a file: Mapbox cannot load full map detail this way. Serve the folder with a local web server for the best view.', 'info', 9000);
    }
    requestAnimationFrame(loop);
    try {
      await buildAndPrepare();
    } catch (err) {
      console.error(err);

      toast('Setup failed: ' + err.message, 'error', 8000);
    }

  // ---------------------------------------------------------- auto build

    setStatus('Planning the model grid…');
    const grid = FS.channel.planGrid([MAIN.coords, TRIB.coords], Object.assign({}, SHARED, {
      width: MAIN.width, minWidth: Math.min(MAIN.width, TRIB.width), maxCells: 220000
    }));

    const dem = await FS.terrain.load(grid.bounds, {
      zoom: grid.demZoom, retina: grid.demRetina, token: CFG.MAPBOX_TOKEN,
      onProgress: (d, n) => setStatus('Loading elevation tiles, ' + d + ' of ' + n + '…')
    });
    setStatus('Sampling the terrain…');
    await nextFrame();
    const sampled = FS.terrain.sampleGrid(dem, grid);

    setStatus('Carving the river channels and their confluence…');
    await nextFrame();
    const reaches = [
      { coords: MAIN.coords, name: MAIN.name, width: MAIN.width, depth: MAIN.depth, nChannel: MAIN.nChannel },
      { coords: TRIB.coords, name: TRIB.name, width: TRIB.width, depth: TRIB.depth, nChannel: TRIB.nChannel }
    ];
    const model = FS.channel.buildModel(grid, sampled.z, reaches, Object.assign({}, SHARED, { inletLength: 150 }));

    app.built = { model, grid, impacts: null };
    app.overlays.setModel(model);
    app.overlays.setVisible('particles', true);
    app.overlays.setVisible('outline', true);
    app.overlays.setVisible('arrows', false);
    app.overlays.setVisible('impacts', true);
    app.overlays.setVisible('channel', true);
    app.overlays.setOpacity(0.85);
    renderLegend();
    loadImpacts(grid, model); // buildings + roads, fetched in the background

    const hydros = model.reaches.map((r) => FS.hydrograph.build({
      type: 'wave',
      base: BASE_MULT * r.bankfullQ,
      peak: PEAK_MULT * r.bankfullQ,
      timeToPeak: TIME_TO_PEAK_H,
      shape: 5,
      duration: DURATION_H
    }));
    const duration = Math.max.apply(null, hydros.map((hy) => hy.duration));
    const tables = hydros.map((hy) => FS.hydrograph.sample(hy, 60, duration));
    const init = FS.channel.initialDepths(model, hydros.map((hy) => hy.q(0)));
    const nx = grid.nx, ny = grid.ny, dx = grid.dx;

    const config = {
      nx: nx, ny: ny, dx: dx,
      z: model.z,
      manning: model.manning,
      channelMask: model.notLand,
      h0: init.h0,
      sources: model.reaches.map((r, i) => ({ cells: r.inletCells, hydrograph: tables[i] })),
      outletCells: model.outletCells,
      duration: duration,
      spinup: SPINUP_S,
      frameInterval: FS.simulation.frameIntervalFor(duration, 240),
      params: {
        alpha: 0.7, froudeMax: 1, theta: 0.8, floodDepth: FLOOD_DEPTH,
        outletSlope: model.outletSlope, outletFactor: model.outletFactor
      }
    };
    const N = nx * ny;
    app.run = { duration: duration, floodDepth: FLOOD_DEPTH };
    app.state = new FS.simulation.FloodState(N);
    app.peak = new FS.simulation.PeakEnvelope(N);
    app.series = { t: [], area: [] };
    app.box = null;
    app.playback = new FS.simulation.Playback(PLAYBACK_SPEED);
    app.sim = new FS.simulation.Simulation(config, { memoryBytes: 220 * 1048576 }, {
      onFrame: onFrame, onProgress: onProgress, onDone: onDone, onError: onError
    });

    $('clock-total').textContent = 'of ' + fmt.clock(duration) + ' h';
    $('stat-ratio').textContent = PEAK_MULT + '× bankfull';
    $('info-line').textContent =
      MAIN.name + ' and ' + TRIB.name + ' are each carved too small for the flood they are given (' +
      PEAK_MULT + '× their own bankfull capacity), so both overflow, meet at the confluence, and merge into one flooded valley.';

    fitToConfluence();
    setStatus('Computing ahead… (bankfull: ' + fmt.int(model.reaches[0].bankfullQ) + ' + ' + fmt.int(model.reaches[1].bankfullQ) + ' m³/s)');
    $('btn-play').disabled = false;
  }

  /** Buildings and roads from Mapbox Streets, fetched after the model exists so it never
   *  delays the terrain/hydraulics pipeline or the first Play. */
  async function loadImpacts(grid, model) {
    try {
      const infra = await FS.mapdata.loadInfrastructure(grid.bounds, { token: CFG.MAPBOX_TOKEN });
      if (!app.built || app.built.model !== model) return; // superseded by a later build
      const mapped = FS.channel.mapInfrastructure(model, infra);
      mapped.roads = [];      // houses only - no road lines in this view
      mapped.facilities = [];
      app.built.impacts = new FS.impacts.Impacts(mapped, CFG.impacts);
      app.needsRender = true;
    } catch (err) {
      console.warn('Buildings and roads could not be loaded:', err.message);
    }
  }

  /**
   * Close top-down camera on the confluence itself, not the whole 5+3 km river
   * network - a tight, walkable-scale view where individual houses read clearly.
   * The modelled grid still extends well beyond this frame so the flood has room
   * to spread; that extra area is simply outside the initial view.
   */
  function fitToConfluence() {
    const center = TRIB.coords[TRIB.coords.length - 1]; // where the tributary meets the main river
    const latRad = center[1] * Math.PI / 180;
    const halfWidthM = 250, halfHeightM = 100; // a ~0.9 x 0.6 km close-up
    const dLat = halfHeightM / 111320;
    const dLng = halfWidthM / (111320 * Math.cos(latRad));
    app.map.fitBounds(
      [[center[0] - dLng, center[1] - dLat], [center[0] + dLng, center[1] + dLat]],
      { padding: 20, duration: 1200 }
    );
  }

  // ------------------------------------------------------------- path editor
  // Lets you drag the river/tributary points to match the real channel, then
  // copy the corrected coordinates back into flood-sim/js/config.js by hand.
  // Press E to show/hide the edit panel and the draggable points.
  const net = { reaches: [MAIN, TRIB], selected: 0 };
  let editUIOn = false;

  function renderNetwork(editCoords, editing) {
    const list = net.reaches.map((r, i) => ({ name: r.name, coords: i === net.selected ? editCoords : r.coords }));
    app.overlays.setNetwork(list, net.selected, editing);
  }

  function onEditorEvent(type, payload) {
    if (type === 'change') net.reaches[net.selected].coords = payload.map((c) => [c[0], c[1]]);
  }

  function updateReachTabs() {
    for (let i = 0; i < net.reaches.length; i++) {
      $('edit-tab-' + i).classList.toggle('active', i === net.selected);
    }
  }

  function selectReach(i) {
    if (i === net.selected || !net.reaches[i]) return;
    net.selected = i;
    app.editor.setCoords(net.reaches[i].coords, true);
    updateReachTabs();
  }

  const WATER_LAYERS = ['flood', 'particles', 'outline', 'channel'];
  function setWaterHidden(hide) {
    for (const key of WATER_LAYERS) app.overlays.setVisible(key, !hide);
  }

  function setEditUI(on) {
    editUIOn = on;
    $('edit-panel').hidden = !on;
    app.overlays.setRiverVisible(on);
    if (on) {
      app.editor.setCoords(net.reaches[net.selected].coords, true);
      app.editor.setMode('edit');
    } else {
      app.editor.cancel();
      if ($('edit-hide-water').checked) {
        $('edit-hide-water').checked = false;
        setWaterHidden(false);
      }
    }
    updateReachTabs();
  }

  function toggleEditUI() { setEditUI(!editUIOn); }

  function copyCoordsJson() {
    const round = (c) => [Math.round(c[0] * 1e5) / 1e5, Math.round(c[1] * 1e5) / 1e5];
    const data = {
      defaultRiver: { name: MAIN.name, coordinates: MAIN.coords.map(round) },
      defaultNetwork: [{ name: TRIB.name, coordinates: TRIB.coords.map(round) }]
    };
    const text = JSON.stringify(data, null, 2);
    console.log('Edited river coordinates — paste into flood-sim/js/config.js:\n' + text);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => toast('Coordinates copied — paste into config.js', 'info', 5000))
        .catch(() => toast('Could not copy — printed to the console instead', 'info', 5000));
    } else {
      toast('Printed the coordinates JSON to the console (F12)', 'info', 5000);
    }
  }

  async function autoDetectFromMap() {
    const map = app.map;
    if (map.getZoom() < 11) {
      toast('Zoom in closer to the river first, then try again.', 'info', 4000);
      return;
    }
    const btn = $('edit-detect-btn');
    btn.disabled = true;
    btn.textContent = 'Searching…';
    try {
      const b = map.getBounds();
      const diag = FS.geo.haversine([b.getWest(), b.getSouth()], [b.getEast(), b.getNorth()]);
      const center = map.getCenter();
      const river = await FS.mapdata.detectRiver([center.lng, center.lat], {
        token: CFG.MAPBOX_TOKEN,
        searchRadius: Math.min(Math.max(diag * 0.6, 2000), 6000),
        reachLength: Math.min(Math.max(diag * 0.7, 1500), 6000),
        tributaryLength: Math.min(Math.max(diag * 0.4, 1000), 3500)
      });
      if (!river) {
        toast('No river found near the map centre. Pan/zoom to it and try again.', 'info', 5000);
        return;
      }
      MAIN.coords = river.coordinates;
      if (river.name) MAIN.name = river.name;
      const trib = river.tributaries && river.tributaries[0];
      if (trib) {
        TRIB.coords = trib.coordinates;
        if (trib.name) TRIB.name = trib.name;
      }
      app.editor.setCoords(net.reaches[net.selected].coords, true);
      toast('Detected ' + (river.name || 'a river') + ' from map data (' + fmt.int(river.length) + ' m)' +
        (trib ? ', plus a tributary' : '') + '. Fine-tune if needed, then copy JSON.', 'info', 7000);
    } catch (err) {
      toast('Detection failed: ' + err.message, 'error', 6000);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Auto-detect from map (OSM waterway data)';
    }
  }

  function initEditor() {
    app.editor = new FS.editor.RiverEditor(app.map, app.overlays, onEditorEvent);
    app.editor.renderFn = renderNetwork;
    $('edit-tab-0').addEventListener('click', () => selectReach(0));
    $('edit-tab-1').addEventListener('click', () => selectReach(1));
    $('edit-copy-btn').addEventListener('click', copyCoordsJson);
    $('edit-detect-btn').addEventListener('click', autoDetectFromMap);
    $('edit-hide-water').addEventListener('change', (e) => setWaterHidden(e.target.checked));
    updateReachTabs();
  }

  function renderLegend() {
    const ramp = FS.colors.depth;
    $('legend-bar').style.background = ramp.gradient();
    const ticks = $('legend-ticks');
    ticks.replaceChildren();
    for (let i = 0; i < ramp.ticks.length; i++) {
      const v = ramp.ticks[i];
      const s = document.createElement('span');
      s.textContent = String(v);
      s.style.left = (ramp.position(v) * 100).toFixed(1) + '%';
      ticks.appendChild(s);
    }
    $('legend-card').hidden = false;
  }

  // ------------------------------------------------------------ sim events
  function onFrame(sim, frame) {
    if (sim !== app.sim) return;
    const s = frame.stats;
    if (s.t >= 0) {
      app.series.t.push(s.t);
      app.series.area.push(s.floodArea);
    }
    const nx = app.built.grid.nx;
    const box = app.box || { i0: Infinity, i1: -Infinity, j0: Infinity, j1: -Infinity };
    for (let k = 0; k < frame.newTracked.length; k++) {
      const c = frame.newTracked[k];
      const j = (c / nx) | 0, i = c - j * nx;
      if (i < box.i0) box.i0 = i;
      if (i > box.i1) box.i1 = i;
      if (j < box.j0) box.j0 = j;
      if (j > box.j1) box.j1 = j;
    }
    app.box = box;
    if (sim.store.length === 1) app.needsRender = true;
  }

  function onProgress(sim) {
    if (sim !== app.sim || app.playback.playing) return;
    setStatus('Computed ahead to ' + fmt.clock(sim.computeT) + ' h — press Play');
  }

  function onDone(sim) {
    if (sim !== app.sim) return;
    if (!app.playback.playing) setStatus('Ready — press Play');
  }

  function onError(sim, message) {
    if (sim !== app.sim) return;
    toast('The simulation stopped. ' + message, 'error', 8000);
    setStatus('Stopped with an error', 'error');
  }

  // -------------------------------------------------------------- playback
  function togglePlay() {
    const p = app.playback;
    if (!p) return;
    if (p.playing) {
      p.pause();
    } else {
      if (p.t >= app.run.duration - 1) p.seek(0);
      p.play();
    }
    $('btn-play').classList.toggle('playing', p.playing);
    $('btn-play').setAttribute('aria-label', p.playing ? 'Pause' : 'Play');
    $('play-hint').hidden = p.playing;
    app.needsRender = true;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dtReal = app.lastNow ? Math.min(0.1, (now - app.lastNow) / 1000) : 0;
    app.lastNow = now;
    const sim = app.sim, p = app.playback;
    if (sim && p && app.run) {
      const wasPlaying = p.playing;
      const changed = p.advance(now, sim.store.length ? sim.store.lastT : -Infinity, app.run.duration);
      if (wasPlaying && !p.playing) {
        $('btn-play').classList.remove('playing');
        $('play-hint').hidden = false;
        setStatus(p.t >= app.run.duration - 1 ? 'Flood finished — press Play to watch again' : 'Paused — press Play to continue');
      }
      if (changed || app.needsRender) {
        app.needsRender = false;
        renderState(now);
      }
    }
    if (app.overlays && app.state && app.state.stats) app.overlays.animateParticles(dtReal);
    if (app.overlays) app.overlays.tick(now);
  }

  function renderState(now) {
    const sim = app.sim;
    const t = app.playback.t;
    if (!app.state.fill(sim.store, t)) return;
    app.peak.update(sim.store, app.state);
    const cells = sim.store.cells, K = app.state.K;
    app.overlays.renderFlood({
      mode: 'depth', state: app.state, cells: cells, K: K, peak: app.peak.h, arrival: sim.store.arrival,
      tNow: app.state.t, floodDepth: app.run.floodDepth
    });
    app.overlays.updateParticles(app.state, cells, K);
    $('clock-now').textContent = fmt.clock(app.state.t);

    if (now - app.timers.readout > 120) {
      app.timers.readout = now;
      $('stat-area').textContent = fmt.area(app.state.stats.floodArea);
      if (app.playback.playing) {
        setStatus(app.playback.buffering ? 'Playback is waiting for the model to catch up…' : 'Playing…');
      }
    }
    if (now - app.timers.outline > 250) {
      app.timers.outline = now;
      const box = app.box ? { i0: app.box.i0 - 2, i1: app.box.i1 + 2, j0: app.box.j0 - 2, j1: app.box.j1 + 2 } : null;
      app.overlays.updateOutline(app.state.h, app.run.floodDepth, box);
    }
    const impacts = app.built.impacts;
    if (impacts && now - app.timers.impacts > 400) {
      app.timers.impacts = now;
      app.overlays.updateImpacts(impacts.features(app.state.h, app.peak.h));
    }
  }

  if (typeof mapboxgl === 'undefined') {
    document.body.insertAdjacentHTML('beforeend', '<p class="toast" data-kind="error">Mapbox GL JS did not load. Check your internet connection and reload.</p>');
  } else {
    initMap();
  }
})(self.FloodSim = self.FloodSim || {});


</script>
</body>

</html>
